name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked — lock↔package.json 드리프트 검출)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # tsc -b 가 포함돼 있어 타입 오류도 여기서 잡힌다.
      # 빌드는 .env 없이도 통과해야 한다 — API 호출은 전부 런타임이고,
      # VITE_API_URL 미설정은 코드에서 ApiError로 처리한다.
      - name: Build (typecheck 포함)
        run: npm run build
